name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.2"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install native dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          cmake
          libegl1-mesa-dev
          libpipewire-0.3-dev
          libwayland-dev
          libxkbcommon-dev
          libx11-xcb-dev
          libxcb-render0-dev
          libxcb-shape0-dev
          libxcb-xfixes0-dev

      - name: Check PipeWire API baseline
        if: runner.os == 'Linux'
        run: |
          pkg-config --modversion libpipewire-0.3
          pkg-config --atleast-version=1.0 libpipewire-0.3

      - name: Install Rust components
        run: rustup component add clippy rustfmt

      - name: Cache Rust build data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

      - name: Validate development tools
        run: |
          cargo clippy --workspace --all-targets --features development --locked -- -D warnings
          cargo test --workspace --all-targets --features development --locked
          python3 -m unittest discover -s scripts/tests

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package and verify local macOS app
        if: runner.os == 'macOS'
        run: ./scripts/build-macos.sh
