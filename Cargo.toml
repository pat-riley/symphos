[package]
name = "symphos"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A high-performance native audio analyzer and visualizer for Omarchy"
license = "MIT"
readme = "README.md"
repository = "https://github.com/pat-riley/symphos"
homepage = "https://github.com/pat-riley/symphos"
keywords = ["audio", "visualizer", "pipewire", "wgpu", "omarchy"]
categories = ["multimedia::audio", "visualization"]

[features]
development = []

[workspace]
members = ["crates/symphos-visuals"]

[dependencies]
symphos-visuals = { path = "crates/symphos-visuals" }
anyhow = "1.0"
arc-swap = "1.7"
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "wayland", "wgpu", "x11"] }
env_logger = "0.11"
log = "0.4"
realfft = "3.5.0"
rtrb = "0.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
egui = { version = "0.36.1", features = ["serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Keep the API baseline compatible with Ubuntu 24.04's PipeWire 1.0 headers.
pipewire = { version = "0.10.1", features = ["v1_0_0"] }

[build-dependencies]
cc = "1.2"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
